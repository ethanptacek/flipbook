<div class="fb" data-theme="dark" data-mode="spread">

  <header class="fb-bar fb-bar--top">

      <span class="fb-brand__mark">Warning Lites</span>
      <span class="fb-brand__title">2026 Product Catalog</span>
    </div>

    <nav class="fb-tools" aria-label="Catalog tools">
      <button class="fb-btn" type="button" data-act="contents" data-tip="Contents" aria-pressed="false">

      <button class="fb-btn" type="button" data-act="fullscreen" data-tip="Fullscreen" aria-pressed="false">
        <svg aria-hidden="true"><use href="#i-maximize"/></svg><span class="fb-sr">Fullscreen</span>
      </button>
      <a class="fb-btn" data-act="download" href="pages/catalog.pdf" download data-tip="Download the PDF">
        <svg aria-hidden="true"><use href="#i-download"/></svg><span class="fb-btn__label">PDF</span>
      </a>
    </nav>
  </header>

  <main class="fb-stage">
    <button class="fb-nav fb-nav--prev" type="button" data-act="prev">
      <svg aria-hidden="true"><use href="#i-prev"/></svg><span class="fb-sr">Previous page</span>

    <div class="fb-book-wrap">

        <div class="fb-side fb-side--left is-empty">

          <img alt="">
          <div class="fb-gutter"></div>
          <div class="fb-cast"></div>
          <div class="fb-folio"></div>
        </div>
        <div class="fb-side fb-side--right">
          <div class="fb-stack"></div>
          <img alt="">
          <div class="fb-gutter"></div>
          <div class="fb-cast"></div>
          <div class="fb-folio"></div>
        </div>

        <div class="fb-flipper" aria-hidden="true">
          <div class="fb-face fb-face--front">
            <img alt=""><div class="fb-gutter"></div><div class="fb-shade"></div>
          </div>
          <div class="fb-face fb-face--back">

          </div>
        </div>
      </div>
    </div>

    <button class="fb-nav fb-nav--next" type="button" data-act="next">
      <svg aria-hidden="true"><use href="#i-next"/></svg><span class="fb-sr">Next page</span>
    </button>

  <footer class="fb-bar fb-bar--bottom">

      <span class="fb-counter__n">Page <b>01</b> / 21</span>
      <span class="fb-counter__t">Cover</span>
    </p>
    <button class="fb-step" type="button" data-act="next" data-tip="Next">
      <svg aria-hidden="true"><use href="#i-next"/></svg><span class="fb-sr">Next page</span>
    </button>
  </footer>

  <div class="fb-progress" aria-hidden="true"><i></i></div>

  <!-- contents ------------------------------------------------------- -->
  <section class="fb-drawer" aria-label="Catalog contents">
    <header class="fb-drawer__head">
      <h2 class="fb-drawer__title">Contents</h2>
      <button class="fb-btn" type="button" data-act="close-drawer" data-tip="Close">
        <svg aria-hidden="true"><use href="#i-x"/></svg><span class="fb-sr">Close contents</span>
      </button>
    </header>
    <div class="fb-drawer__body"></div>
  </section>

  <!-- zoom ----------------------------------------------------------- -->
  <section class="fb-lightbox" aria-label="Page zoom">
    <header class="fb-lightbox__head">
      <button class="fb-btn" type="button" data-act="zoom-prev" data-tip="Previous page">
        <svg aria-hidden="true"><use href="#i-prev"/></svg><span class="fb-sr">Previous page</span>
      </button>
      <button class="fb-btn" type="button" data-act="zoom-next" data-tip="Next page">

      <div class="fb-boot__bar"><i></i></div>
      <p class="fb-boot__err" hidden></p>
    </div>
  </div>
